name: Sleep documentary voice and assets

# Generates narration (Indian-English neural voice), voice comparison samples,
# Commons photos, AI images and depth maps; publishes them to branch "doc-out".
on:
  push:
    branches: [doc-request]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doc-request
  cancel-in-progress: true

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install "edge-tts>=7.0" && python3 tts_edge.py
      - uses: actions/upload-artifact@v4
        with: {name: tts, path: out}

  parler:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/huggingface/parler-tts.git soundfile
          python3 tts_parler.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: parler, path: out, if-no-files-found: ignore}

  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python3 assets.py
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers pillow
          python3 depth.py || true
      - uses: actions/upload-artifact@v4
        with: {name: assets, path: out}

  publish:
    needs: [tts, parler, assets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: art}
      - run: |
          mkdir pub && for d in art/*; do cp -r $d/. pub/; done
          cd pub && echo "${{ github.sha }}" > RUN_SHA && ls -R | head -200
          git init -q -b doc-out && git config user.name doc-bot && git config user.email actions@users.noreply.github.com
          git add -A && git commit -q -m "doc assets ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" doc-out
