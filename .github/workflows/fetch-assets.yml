name: Fetch photo assets

# Downloads the public-domain / openly licensed images listed in request.json
# and publishes them on the "assets" branch (replaced on every request).
on:
  push:
    branches: [assets-request]
    paths: [request.json]

permissions:
  contents: write

concurrency:
  group: fetch-assets
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: python3 fetch.py
      - name: Publish to assets branch
        run: |
          cd out
          git init -q -b assets
          git config user.name "asset-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "assets for $(python3 -c "import json;print(json.load(open('manifest.json'))['id'])")"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" assets
