name: Refresh Instagram tokens

# Instagram tokens last 60 days. This renews every Instagram channel's token
# each week. It needs a secret named GH_PAT: a fine-grained GitHub token for
# this repo with "Secrets: read and write" (the dashboard token works).

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT is not set, so Instagram tokens were not renewed. They expire 60 days after they were made."
            exit 0
          fi
          pip install --quiet requests
          python3 poster/refresh_ig.py
