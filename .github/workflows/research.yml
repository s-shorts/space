name: Audience research

# Runs the searches in request.json (YouTube views, autocomplete, Reddit, Google Trends,
# Wikipedia pageviews, our own channel's view counts) and publishes out/results.json
# on the "research" branch (replaced on every request).
on:
  push:
    branches: [research-request]
    paths: [request.json]

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Our published list
        run: |
          git fetch -q --depth 1 origin media || true
          git show origin/media:published.jsonl > published.jsonl 2>/dev/null || true
      - name: Research
        run: |
          pip install --quiet requests yt-dlp
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          python3 research.py
      - name: Publish to research branch
        run: |
          cd out
          git init -q -b research
          git config user.name "research-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "research $(python3 -c "import json;print(json.load(open('results.json'))['id'])")"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" research
